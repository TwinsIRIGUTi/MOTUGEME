<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <style>

        html, body {

<body>

    <div id="app-wrapper">
        <div id="scaler">

                                <div class="result-row">
                                    <span class="result-label"><span class="badge-icon" style="background-color: #ffaaa6;"></span>コブクロ</span>
                                    <span id="kobukuro-count" class="result-val">0個</span>
                                </div>
                                <div class="result-row">
                                    <span class="result-label"><span class="badge-icon" style="background-color: #f8a5c2;"></span>テッポウ</span>

                                <div class="result-row">
                                    <span class="result-label"><span class="badge-icon" style="background-color: #b33939;"></span>カシラ</span>

<script>
// ==========================================
// 画面自動スケーリング処理（見切れ防止）
// ==========================================
function updateScale() {
    const scaler = document.getElementById("scaler");
    const targetWidth = 450;
    const targetHeight = 720;
    
    const windowWidth = window.innerWidth - 10;
    const windowHeight = window.innerHeight - 10;

    const scaleX = windowWidth / targetWidth;
    const scaleY = windowHeight / targetHeight;
    const scale = Math.min(scaleX, scaleY, 1.0);

    scaler.style.transform = `scale(${scale})`;
}

window.addEventListener("resize", updateScale);
window.addEventListener("orientationchange", () => setTimeout(updateScale, 100));
updateScale();

// ==========================================
// まったり・和風アコースティックBGM & SE（Web Audio API）
// ==========================================
let audioCtx = null;
let isSoundEnabled = false;
let bgmTimer = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function toggleSound() {
    initAudio();
    isSoundEnabled = !isSoundEnabled;
    const btn = document.getElementById("sound-btn");
    
    if (isSoundEnabled) {
        btn.innerText = "BGM: ON";
        btn.style.background = "#27ae60";
        startBGM();
    } else {
        btn.innerText = "BGM: OFF";
        btn.style.background = "#7f8c8d";
        stopBGM();
    }
}

// ドロップ音
function playDropSound() {
    if (!audioCtx || audioCtx.state !== 'running' || !isSoundEnabled) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = "sine";
    osc.frequency.setValueAtTime(260, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.15);
    
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
}

// 合体音
function playMergeSound(level) {
    if (!audioCtx || audioCtx.state !== 'running' || !isSoundEnabled) return;
    const baseFreq = 220 + level * 28;
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = "sine";
    osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.4, audioCtx.currentTime + 0.1);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.6, audioCtx.currentTime + 0.22);
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
}

// ゲームオーバー音
function playGameOverSound() {
    if (!audioCtx || audioCtx.state !== 'running' || !isSoundEnabled) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = "triangle";
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.8);
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.8);
}

// まったり和風アルペジオBGM
function startBGM() {
    if (!isSoundEnabled || bgmTimer) return;
    
    // 和風都節・陽旋法音階 (D4, F4, G4, A4, C5, D5, F5)
    const scaleNotes = [293.66, 349.23, 392.00, 440.00, 523.25, 587.33, 698.46];
    const sequence = [0, 2, 3, 4, 3, 2, 1, 3, 2, 4, 5, 4, 3, 1];
    let step = 0;

    bgmTimer = setInterval(() => {
        if (!audioCtx || !isSoundEnabled) return;

        const note = scaleNotes[sequence[step % sequence.length]];
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = "triangle";
        osc.frequency.setValueAtTime(note, audioCtx.currentTime);

        filter.type = "lowpass";
        filter.frequency.setValueAtTime(800, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.55);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.55);

        step++;
    }, 450);
}

function stopBGM() {
    if (bgmTimer) {
        clearInterval(bgmTimer);
        bgmTimer = null;
    }
}

// ==========================================
// スコアランキング（localStorage）
// ==========================================
function getHighScores() {
    const scores = localStorage.getItem("motsu_scores");
    return scores ? JSON.parse(scores) : [0, 0, 0, 0, 0];
}

function saveScore(newScore) {
    if (newScore <= 0) return;
    let scores = getHighScores();
    scores.push(newScore);
    scores.sort((a, b) => b - a);
    scores = scores.slice(0, 5);
    localStorage.setItem("motsu_scores", JSON.stringify(scores));
}

function updateTitleRankingDisplay() {
    const list = document.getElementById("title-ranking-list");
    list.innerHTML = "";
    const scores = getHighScores();
    
    scores.forEach((sc, idx) => {
        const item = document.createElement("div");
        item.className = "ranking-item";
        item.innerHTML = `<span class="rank-num">${idx + 1}位</span><span class="rank-score">${sc}点</span>`;
        list.appendChild(item);
    });
}

// ==========================================
// 【モツ定義データ】
// ==========================================
const MOTSU_TYPES = [
    { name: "シロ",     radius: 13, color: "#f5f6fa", score: 1,  image: "images/shiro.png" },
    { name: "レバ",     radius: 19, color: "#8b1e0f", score: 3,  image: "images/reba.png" },
    { name: "ガツ",     radius: 26, color: "#f5cd79", score: 6,  image: "images/gatsu.png" },
    { name: "アブラ",   radius: 34, color: "#fff200", score: 10, image: "images/abura.png" },
    { name: "ナンコツ", radius: 42, color: "#bdc3c7", score: 15, image: "images/nankotsu.png" },
    { name: "ハツ",     radius: 51, color: "#d63031", score: 21, image: "images/hatsu.png" },
    { name: "タン",     radius: 61, color: "#e17055", score: 28, image: "images/tan.png" },
    { name: "カシラ",   radius: 71, color: "#b33939", score: 36, image: "images/kashira.png" },
    { name: "テッポウ", radius: 82, color: "#f8a5c2", score: 45, image: "images/teppou.png" },
    { name: "コブクロ", radius: 93, color: "#ffaaa6", score: 55, image: "images/kobukuro.png" },
    { name: "ツル",     radius: 105, color: "#1abc9c", score: 66, image: "images/tsuru.png" }
];

const cacheBuster = Date.now();
MOTSU_TYPES.forEach(matsu => {
    if (matsu.image) {
        const img = new Image();
        img.src = matsu.image + "?v=" + cacheBuster;
        matsu.imgElement = img;
    }
});

const { Engine, Runner, Bodies, Composite, Body, Events } = Matter;

let engine, world, runner;
const canvas = document.getElementById("game-canvas");
const ctx = canvas.getContext("2d");
const nextCanvas = document.getElementById("next-canvas");
const nextCtx = nextCanvas.getContext("2d");

const WIDTH = 400;
const HEIGHT = 560;
const DEAD_LINE = 95; 

let score = 0;
let tsuruCreatedCount = 0;
let kobukuroCreatedCount = 0;
let teppouCreatedCount = 0;
let kashiraCreatedCount = 0;

let currentMotsuIndex = 0;
let nextMotsuIndex = 0;
let isReadyToDrop = true;
let previewX = WIDTH / 2;
let gameOver = false;
let isPlaying = false;

const MOTSU_PHYSICS = {
    restitution: 0.18, 
    friction: 0.08,    
    density: 0.001
};

function initEngine() {
    engine = Engine.create({ 
        gravity: { y: 1.0 },
        constraintIterations: 4 
    });
    world = engine.world;

    const wallOptions = { isStatic: true, friction: 0.1, render: { visible: false } };
    const ground = Bodies.rectangle(WIDTH / 2, HEIGHT + 40, WIDTH + 100, 80, wallOptions);
    const leftWall = Bodies.rectangle(-40, HEIGHT / 2, 80, HEIGHT + 100, wallOptions);
    const rightWall = Bodies.rectangle(WIDTH + 40, HEIGHT / 2, 80, HEIGHT + 100, wallOptions);
    Composite.add(world, [ground, leftWall, rightWall]);

    runner = Runner.create();
    Runner.run(runner, engine);

    // 衝突イベント
    Events.on(engine, 'collisionStart', handleCollision);
    // 更新後イベント（ラインオーバー判定）
    Events.on(engine, 'afterUpdate', handleAfterUpdate);
}

function getRandomMotsuIndex() {
    return Math.floor(Math.random() * 5);
}

function buildEvolutionGuide() {
    const guide = document.getElementById("evolution-line");
    guide.innerHTML = "";
    const maxRadius = MOTSU_TYPES[MOTSU_TYPES.length - 1].radius;
    
    MOTSU_TYPES.forEach(m => {
        const item = document.createElement("div");
        item.className = "evo-item";
        
        const displaySize = Math.max(6, (m.radius / maxRadius) * 20);
        
        const circle = document.createElement("div");
        circle.className = "evo-circle";
        circle.style.width = `${displaySize}px`;
        circle.style.height = `${displaySize}px`;
        
        if (m.image) {
            circle.style.backgroundImage = `url(${m.image}?v=${cacheBuster})`;
        } else {
            circle.style.backgroundColor = m.color;
        }
        
        const name = document.createElement("span");
        name.className = "evo-name";
        name.innerText = m.name;
        
        item.appendChild(circle);
        item.appendChild(name);
        guide.appendChild(item);
    });
}

function drawNext() {
    nextCtx.clearRect(0, 0, 44, 44);
    const nextType = MOTSU_TYPES[nextMotsuIndex];
    const r = Math.min(14, nextType.radius * 0.75);

    nextCtx.save();
    nextCtx.beginPath();
    nextCtx.arc(22, 22, r, 0, 2 * Math.PI);
    nextCtx.closePath();
    nextCtx.clip();

    if (nextType.imgElement && nextType.imgElement.complete && nextType.imgElement.naturalWidth !== 0) {
        nextCtx.drawImage(nextType.imgElement, 22 - r, 22 - r, r * 2, r * 2);
    } else {
        nextCtx.fillStyle = nextType.color;
        nextCtx.fill();
    }

    nextCtx.restore();

    nextCtx.strokeStyle = "#fff";
    nextCtx.lineWidth = 1.5;
    nextCtx.beginPath();
    nextCtx.arc(22, 22, r, 0, 2 * Math.PI);
    nextCtx.stroke();
}

function drawMotsu(context, x, y, radius, angle, type, alpha = 1.0) {
    context.save();
    context.translate(x, y);
    context.rotate(angle);
    context.globalAlpha = alpha;

    context.beginPath();
    context.arc(0, 0, radius, 0, 2 * Math.PI);
    context.closePath();
    context.clip();

    if (type.imgElement && type.imgElement.complete && type.imgElement.naturalWidth !== 0) {
        context.drawImage(type.imgElement, -radius, -radius, radius * 2, radius * 2);
    } else {
        context.fillStyle = type.color;
        context.fill();
    }

    context.restore();

    context.save();
    context.translate(x, y);
    context.globalAlpha = alpha;
    context.strokeStyle = "#231815";
    context.lineWidth = 2.5;
    context.beginPath();
    context.arc(0, 0, radius, 0, 2 * Math.PI);
    context.stroke();

    if (!type.imgElement || !type.imgElement.complete || type.imgElement.naturalWidth === 0) {
        context.rotate(angle);
        context.fillStyle = (type.color === "#f5f6fa" || type.color === "#fff200" || type.color === "#ffaaa6") ? "#231815" : "#fff";
        context.font = `bold ${Math.max(9, radius * 0.42)}px sans-serif`;
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(type.name, 0, 0);
    }

    context.restore();
}

function renderLoop() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    ctx.strokeStyle = "rgba(230, 126, 34, 0.4)";
    ctx.setLineDash([6, 4]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, DEAD_LINE);
    ctx.lineTo(WIDTH, DEAD_LINE);
    ctx.stroke();
    ctx.setLineDash([]);

    if (engine) {
        const bodies = Composite.allBodies(world);
        bodies.forEach(body => {
            if (body.isStatic) return;
            const type = body.motsuType;
            if (!type) return;

            drawMotsu(ctx, body.position.x, body.position.y, type.radius, body.angle, type);
        });
    }

    if (isPlaying && isReadyToDrop && !gameOver) {
        const currentType = MOTSU_TYPES[currentMotsuIndex];
        drawMotsu(ctx, previewX, DEAD_LINE - 25, currentType.radius, 0, currentType, 0.8);
        
        ctx.strokeStyle = "rgba(35, 24, 21, 0.1)";
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(previewX, DEAD_LINE - 25);
        ctx.lineTo(previewX, HEIGHT);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    requestAnimationFrame(renderLoop);
}

function updatePreviewPosition(clientX) {
    if (!isPlaying || !isReadyToDrop || gameOver) return;
    const rect = canvas.getBoundingClientRect();
    
    // スケーリング比率の補正
    const scale = rect.width / WIDTH;
    previewX = (clientX - rect.left) / scale;
    
    const r = MOTSU_TYPES[currentMotsuIndex].radius;
    if (previewX < r) previewX = r;
    if (previewX > WIDTH - r) previewX = WIDTH - r;
}

canvas.addEventListener("mousemove", (e) => updatePreviewPosition(e.clientX));
canvas.addEventListener("click", () => { 
    if(!isPlaying) return;
    initAudio();
    if(isReadyToDrop && !gameOver) dropMotsu(); 
});

canvas.addEventListener("touchmove", (e) => {
    if(!isPlaying) return;
    updatePreviewPosition(e.touches[0].clientX);
    e.preventDefault();
}, { passive: false });

canvas.addEventListener("touchend", () => { 
    if(!isPlaying) return;
    initAudio();
    if(isReadyToDrop && !gameOver) dropMotsu(); 
});

function dropMotsu() {
    isReadyToDrop = false;
    playDropSound();

    const type = MOTSU_TYPES[currentMotsuIndex];
    
    const motsu = Bodies.circle(previewX, DEAD_LINE - 25, type.radius, {
        restitution: MOTSU_PHYSICS.restitution,
        friction: MOTSU_PHYSICS.friction,
        density: MOTSU_PHYSICS.density
    });
    
    motsu.motsuType = type;
    motsu.spawnTime = Date.now();
    motsu.lockTimer = 0;

    Composite.add(world, motsu);

    currentMotsuIndex = nextMotsuIndex;
    nextMotsuIndex = getRandomMotsuIndex();
    drawNext();

    setTimeout(() => {
        isReadyToDrop = true;
        updatePreviewPosition(previewX);
    }, 600);
}

function handleCollision(event) {
    const pairs = event.pairs;
    
    pairs.forEach(pair => {
        const bodyA = pair.bodyA;
        const bodyB = pair.bodyB;

        if (bodyA.motsuType && bodyB.motsuType && bodyA.motsuType.name === bodyB.motsuType.name) {
            if (bodyA.isDead || bodyB.isDead) return;

            const currentIndex = MOTSU_TYPES.findIndex(m => m.name === bodyA.motsuType.name);
            
            if (currentIndex === MOTSU_TYPES.length - 1) {
                score += 100;
                document.getElementById("score-val").innerText = score;
                playMergeSound(currentIndex + 2);
                bodyA.isDead = true; bodyB.isDead = true;
                Composite.remove(world, [bodyA, bodyB]);
                return;
            }

            const midX = (bodyA.position.x + bodyB.position.x) / 2;
            const midY = (bodyA.position.y + bodyB.position.y) / 2;
            const nextType = MOTSU_TYPES[currentIndex + 1];

            if (nextType.name === "ツル") tsuruCreatedCount++;
            else if (nextType.name === "コブクロ") kobukuroCreatedCount++;
            else if (nextType.name === "テッポウ") teppouCreatedCount++;
            else if (nextType.name === "カシラ") kashiraCreatedCount++;

            bodyA.isDead = true;
            bodyB.isDead = true;

            Composite.remove(world, [bodyA, bodyB]);

            const upgraded = Bodies.circle(midX, midY, nextType.radius, {
                restitution: MOTSU_PHYSICS.restitution,
                friction: MOTSU_PHYSICS.friction,
                density: MOTSU_PHYSICS.density
            });
            upgraded.motsuType = nextType;
            upgraded.spawnTime = Date.now();
            upgraded.lockTimer = 0;

            Composite.add(world, upgraded);

            score += nextType.score;
            document.getElementById("score-val").innerText = score;

            playMergeSound(currentIndex + 1);
        }
    });
}

function handleAfterUpdate() {
    if (gameOver || !isPlaying) return;
    
    const bodies = Composite.allBodies(world);
    let triggerGameOver = false;

    bodies.forEach(body => {
        if (body.isStatic) return;
        
        // 赤点線（DEAD_LINE）を超えているか判定
        const topY = body.position.y - body.motsuType.radius;
        
        if (topY < DEAD_LINE) {
            // ドロップ後3秒以上経過しており、画面上で静止した場合のみカウント
            if (Date.now() - body.spawnTime > 3000) { 
                if (body.speed < 0.15) {
                    body.lockTimer += 1;
                    if (body.lockTimer > 90) { // 赤点線上で約1.5秒（90フレーム）動かず静止した場合のみゲームオーバー
                        triggerGameOver = true;
                    }
                } else {
                    body.lockTimer = 0; 
                }
            }
        } else {
            body.lockTimer = 0;
        }
    });

    if (triggerGameOver) {
        gameOverAction();
    }
}

function gameOverAction() {
    if (gameOver) return;
    gameOver = true;
    isPlaying = false;
    
    playGameOverSound();
    saveScore(score);
    
    document.getElementById("modal-score-val").innerText = score;
    document.getElementById("tsuru-count").innerText = `${tsuruCreatedCount}個`;
    document.getElementById("kobukuro-count").innerText = `${kobukuroCreatedCount}個`;
    document.getElementById("teppou-count").innerText = `${teppouCreatedCount}個`;
    document.getElementById("kashira-count").innerText = `${kashiraCreatedCount}個`;
    
    document.getElementById("game-over-modal").style.display = "flex";
}

function startGame() {
    initAudio();
    document.getElementById("title-screen").style.display = "none";
    resetGameState();
}

function restartGame() {
    document.getElementById("game-over-modal").style.display = "none";
    resetGameState();
}

function showTitle() {
    document.getElementById("game-over-modal").style.display = "none";
    document.getElementById("title-screen").style.display = "flex";
    updateTitleRankingDisplay();
    isPlaying = false;
}

function resetGameState() {
    score = 0;
    tsuruCreatedCount = 0;
    kobukuroCreatedCount = 0;
    teppouCreatedCount = 0;
    kashiraCreatedCount = 0;
    
    document.getElementById("score-val").innerText = "0";

    if (engine) {
        Composite.clear(world, false);
        const wallOptions = { isStatic: true, friction: 0.1, render: { visible: false } };
        const ground = Bodies.rectangle(WIDTH / 2, HEIGHT + 40, WIDTH + 100, 80, wallOptions);
        const leftWall = Bodies.rectangle(-40, HEIGHT / 2, 80, HEIGHT + 100, wallOptions);
        const rightWall = Bodies.rectangle(WIDTH + 40, HEIGHT / 2, 80, HEIGHT + 100, wallOptions);
        Composite.add(world, [ground, leftWall, rightWall]);
    } else {
        initEngine();
    }

    currentMotsuIndex = getRandomMotsuIndex();
    nextMotsuIndex = getRandomMotsuIndex();
    drawNext();

    gameOver = false;
    isReadyToDrop = true;
    isPlaying = true;
}

buildEvolutionGuide();
updateTitleRankingDisplay();
requestAnimationFrame(renderLoop);
</script>

</body>
</html>
